# Монтируем кастомный CSS для отличия тестового стенда от прода (см. styles-cm.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          volumeMounts:
            - name: custom-styles
              mountPath: /shared/app/custom
              readOnly: true
      volumes:
        - name: custom-styles
          configMap:
            name: argocd-styles-cm
