# Kargo-проекты ФП: gitops-main/kargo/<проект>/ → Application kargo-<проект> (Project, Warehouse, Stages, задачи, DAST).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kargo-pipelines
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/PonamaryovMV/gitops-main.git
        revision: main
        directories:
          - path: kargo/*
  template:
    metadata:
      name: "kargo-{{ .path.basename }}"
      labels:
        stand/layer: kargo
    spec:
      project: kargo
      source:
        repoURL: https://github.com/PonamaryovMV/gitops-main.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # CRD Kargo может ещё не быть — не валим dry-run, ждём через retry
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
        retry:
          limit: -1
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
