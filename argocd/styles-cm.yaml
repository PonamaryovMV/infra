apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-styles-cm
data:
  custom.css: |
    /* РўРµРјР° РґР»СЏ С‚РµСЃС‚РѕРІРѕРіРѕ СЃС‚РµРЅРґР° Argo CD (РР·СѓРјСЂСѓРґ) */
    .ui-banner {
      background-color: #0f766e !important;
      color: #f0fdfa !important;
      font-weight: 600 !important;
    }

    .sidebar {
      background: linear-gradient(to bottom, #134e4a, #0d3b38) !important;
      width: 180px !important;
      min-width: 180px !important;
    }

    .sidebar__logo {
      position: relative;
      flex-wrap: wrap !important;
      justify-content: center !important;
      width: 100% !important;
    }

    .sidebar__logo::after {
      content: "TEST";
      display: block;
      margin: 4px auto 0;
      padding: 1px 6px;
      width: fit-content;
      border-radius: 4px;
      background-color: #14b8a6;
      color: #042f2e;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      flex-basis: 100%;
      text-align: center;
    }

    .top-bar {
      background-color: #f0fdfa !important;
      border-bottom: 1px solid #99f6e4 !important;
    }

    .top-bar__title {
      color: #134e4a !important;
    }

    img.sidebar__logo__character {
      content: url("./logo.png") !important;
      width: 150px !important;
      height: auto !important;
      max-height: 240px !important;
      object-fit: contain !important;
      display: block !important;
      margin: 0 auto !important;
    }
binaryData:
  logo.png: 
