# Helm-чарт Kargo публикуется только как OCI — Argo CD нужно явно включить enableOCI.
# Публичный репозиторий, учётные данные не нужны.
apiVersion: v1
kind: Secret
metadata:
  name: repo-kargo-charts
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: kargo-charts
  type: helm
  url: ghcr.io/akuity/kargo-charts
  enableOCI: "true"
---
# Общий чарт main (зависимость Chart.yaml сервисов) — OCI в ghcr, публикует gitops-infra/.github/workflows/publish-chart.yaml
apiVersion: v1
kind: Secret
metadata:
  name: repo-stand-charts
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: stand-charts
  type: helm
  url: ghcr.io/ponamaryovmv/charts
  enableOCI: "true"
