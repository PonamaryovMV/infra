# Платформа: Argo CD, cert-manager, Argo Rollouts, Kargo — без ограничений
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
spec:
  description: Платформенные компоненты стенда
  sourceRepos:
    - "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
# Приложения ФП: gitops-main (dev, test, uat) и gitops-prod (prod), неймспейсы <АС>-<ФП>-<окружение>
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
spec:
  description: Сервисы ФП (qa/at/<сервис>/<окружение>)
  sourceRepos:
    - https://github.com/PonamaryovMV/gitops-main.git
    - https://github.com/PonamaryovMV/gitops-prod.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "qa-*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
# Kargo-пайплайны приложений: Project (cluster-scoped) + ресурсы в неймспейсе проекта
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kargo
spec:
  description: Kargo Project / Warehouse / Stage для ФП из gitops-main (kargo/<проект>)
  sourceRepos:
    - https://github.com/PonamaryovMV/gitops-main.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: kargo.akuity.io
      kind: Project
